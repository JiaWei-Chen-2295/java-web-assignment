<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>注册页面</title>
    <link rel="stylesheet" href="css/claude-design.css">
</head>
<body class="theme-root">
<main class="container">
    <section class="panel">
        <h2>用户注册</h2>
        <p class="muted">提交中文昵称用于验证编码过滤器是否生效。</p>
        <form class="form-grid" action="reg" method="post" accept-charset="UTF-8">
            <label>用户名
                <input type="text" name="username" placeholder="请输入用户名">
            </label>
            <label>昵称（中文测试）
                <input type="text" name="nickname" placeholder="例如：小明">
            </label>
            <label>密码
                <input type="password" name="password" placeholder="至少 6 位">
            </label>
            <button class="btn" type="submit">提交注册</button>
        </form>
    </section>
</main>
</body>
</html>
